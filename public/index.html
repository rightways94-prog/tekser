<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Тексер — проверка БЖБ/ТЖБ по дескрипторам</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e4e7ec;--acc:#2f5bd3;--ok:#1f8a4c;--bad:#c4372f;--soft:#eef2fd}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}h1 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
h2{font-size:17px;margin:0 0 10px}main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,label.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary,label.primary{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mut{color:var(--mut);font-size:14px}.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--acc)}
.parts{margin:8px 0 0;padding-left:20px}.parts li{margin:2px 0}
pre{white-space:pre-wrap;background:#fafafa;border:1px dashed var(--line);border-radius:8px;padding:10px;font:15px/1.5 "Comic Sans MS","Segoe Print",cursive;margin:8px 0}
.desc{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.desc input{width:20px;height:20px;margin-top:2px}
.desc span{min-width:0;overflow-wrap:anywhere}.desc .c{color:var(--mut);font-size:14px}.score{font-size:22px;font-weight:700}
.err{background:#fff5f4;border-left:4px solid var(--bad);padding:8px 10px;border-radius:6px;margin:10px 0}
.okbox{background:#f1fbf5;border-left:4px solid var(--ok);padding:8px 10px;border-radius:6px;margin:10px 0}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.bar{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:6px 0}.bar .t{font-size:14px}
.bar .track{grid-column:1/-1;height:10px;background:#eef0f3;border-radius:6px;overflow:hidden}.bar .fill{height:100%;background:var(--bad)}
.tip{background:var(--soft);border-radius:8px;padding:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%}
img.prev{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
.trust-stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0;padding:10px;background:var(--soft);border-radius:8px;font-size:14px}.trust-stats>div{flex:1 1 240px}.trust-stats small{display:block;color:var(--mut);font-size:12px}
.screen{display:grid;gap:14px;min-width:0}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.lesson-button{display:flex;flex-direction:column;gap:8px;text-align:left;height:100%;overflow-wrap:anywhere}.lesson-button:hover{border-color:var(--acc);background:var(--soft)}.lesson-button time{font-size:13px;color:var(--mut)}a.btn{display:inline-block;color:var(--acc);font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-decoration:none}.lesson-assessment{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:600px){.week{grid-template-columns:1fr}}
.batch-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}.batch-photo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px;border-radius:8px;min-width:0}.batch-photo img{width:52px;height:68px;object-fit:contain}.batch-photo label{min-width:0;overflow-wrap:anywhere}.batch-photo input{width:64px;font:inherit}.batch-row{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.batch-row h3{margin:0;font-size:16px}.batch-row details{margin:10px 0}.batch-controls{border:0;margin:0;padding:0;min-width:0}.batch-controls input[type=file]{display:block;max-width:100%;font:inherit}.batch-summary{padding:10px;background:var(--soft);border-radius:8px}.batch-row p{margin:8px 0}
.hidden{display:none}
.brand{flex:1;min-width:0}.accuracy{font-size:12px;line-height:16px;color:var(--mut);margin:4px 0 0;text-wrap:pretty}
.quick-start{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.quick-start summary{cursor:pointer;font-weight:600}.quick-start p{margin:8px 0 0;overflow-wrap:anywhere}
.draft-sources{min-width:0;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.draft-sources input{display:block;max-width:100%;font:inherit}.draft-proposal{padding:10px;background:var(--soft);border-radius:8px}
.sample{margin-top:12px}.sample button{max-width:100%;text-align:left;white-space:normal}.sample small{display:block;margin-top:4px;font-size:12px;line-height:16px;color:var(--mut)}
[hidden]{display:none!important}
@media(max-width:600px){header{flex-wrap:wrap}.brand{flex-basis:100%}header>.row{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Тексер <small data-i="sub"></small></h1><p class="accuracy" data-i="accuracy"></p></div>
  <div class="row"><span id="status" class="badge"></span>
    <span class="lang row"><button data-l="ru" class="on">РУС</button><button data-l="kk">ҚАЗ</button></span></div>
</header>
<main>
  <div id="scheduleScreen" class="screen">
    <section class="card">
      <h2 data-i="desk"></h2>
      <p class="mut" data-i="scheduleTitle"></p>
      <details class="quick-start">
        <summary data-i="quickStart"></summary>
        <p class="mut" data-i="quickSteps"></p>
      </details>
      <p><button id="newBatch" class="primary" data-i="batchNew"></button></p>
      <p><button id="newCustom" data-i="customNew"></button></p>
      <div id="weekGrid" class="week"></div>
    </section>
  </div>
  <div class="row"><button id="backSchedule" class="hidden" data-i="backSchedule"></button><button id="backBatch" class="hidden" data-i="backBatch"></button></div>
  <div id="batchScreen" class="screen hidden">
    <section class="card">
      <h2 data-i="batchNew"></h2>
      <p class="mut" data-i="batchHelp"></p>
      <p id="batchRules" class="mut"></p>
      <fieldset id="batchConfig" class="batch-controls">
        <p><label for="batchFiles" data-i="batchFiles"></label><input id="batchFiles" type="file" accept="image/*" multiple></p>
        <p><label for="batchPages" data-i="batchPages"></label> <select id="batchPages"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></p>
        <p><label for="batchRubricText" data-i="draftRubricText"></label><textarea id="batchRubricText" maxlength="10000" rows="2"></textarea></p>
        <div id="batchGrouping" class="batch-photos"></div>
      </fieldset>
      <p id="batchSummary" class="mut"></p>
      <p id="batchNotice" class="mut" role="status"></p>
      <div class="row"><button id="batchStart" class="primary" data-i="batchStart"></button><button id="batchStop" data-i="batchStop" disabled></button><button id="batchReset" data-i="batchReset"></button></div>
    </section>
    <section id="batchReport" class="card hidden">
      <h2 data-i="batchReport"></h2>
      <p class="mut" data-i="batchAiWarning"></p>
      <p id="batchProgress" class="batch-summary" role="status"></p>
      <p id="batchAgreement" class="mut hidden"></p>
      <button id="batchCSV" data-i="csv"></button>
      <div id="batchRows"></div>
    </section>
  </div>
  <section id="lessonScreen" class="card hidden">
    <p id="lessonDate" class="mut"></p>
    <h2 id="lessonTopic"></h2>
    <b data-i="goal"></b>
    <p id="lessonGoal"></p>
    <a id="lessonSlides" class="btn" href="#" data-i="slides"></a>
    <div id="lessonAssessment" class="lesson-assessment hidden">
      <b data-i="assessment"></b>
      <p id="lessonTask"></p>
      <button id="startAssessment" class="primary" data-i="startAssessment"></button>
    </div>
  </section>
  <div id="assessmentScreen" class="screen hidden">
  <section class="card">
    <h2 data-i="s1"></h2>
    <select id="taskSel" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);width:100%;margin-bottom:6px"></select>
    <form id="customForm" class="hidden">
      <h3 data-i="customNew"></h3>
      <p class="mut" data-i="customHelp"></p>
      <fieldset id="draftSources" class="draft-sources">
        <legend data-i="draftSources"></legend>
        <p class="mut" data-i="draftHelp"></p>
        <p><label for="draftImages" data-i="draftImages"></label><input id="draftImages" type="file" accept="image/*" multiple></p>
        <p><label for="draftRubricImages" data-i="draftRubricImages"></label><input id="draftRubricImages" type="file" accept="image/*" multiple></p>
        <p><label for="draftRubricText" data-i="draftRubricText"></label><textarea id="draftRubricText" rows="3" maxlength="10000"></textarea></p>
        <button id="prepareDraft" type="button" data-i="prepareDraft"></button>
        <p id="draftStatus" class="mut" role="status"></p>
      </fieldset>
      <p id="draftProposal" class="draft-proposal" data-i="draftProposal" hidden></p>
      <p><label for="customTitle" data-i="customTitle"></label><input id="customTitle" required maxlength="120" style="width:100%;font:inherit;padding:8px"></p>
      <p><label for="customPrompt" data-i="customPrompt"></label><textarea id="customPrompt" required maxlength="10000" rows="3"></textarea></p>
      <p><label for="customAnswer" data-i="customAnswer"></label><textarea id="customAnswer" required maxlength="10000" rows="3"></textarea></p>
      <p><label for="customDescriptors" data-i="customDescriptors"></label><textarea id="customDescriptors" required maxlength="15030" rows="4"></textarea></p>
      <button id="saveCustom" type="submit" class="primary" data-i="saveCustom"></button>
    </form>
    <div id="taskTitle" class="mut"></div>
    <ol id="parts" class="parts"></ol>
    <p class="mut" data-i="demoHelp" id="demoHelp"></p>
    <div class="row" id="demoBtns"></div>
    <div id="sampleBox" class="sample" hidden>
      <button id="samplePhoto" data-i="samplePhoto"></button>
      <small data-i="sampleNote"></small>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="btn primary" id="upLabel"><span data-i="upload"></span><input id="file" type="file" accept="image/*" multiple hidden></label>
      <span class="mut" id="upNote"></span>
    </div>
  </section>

  <section class="card hidden" id="checkCard">
    <h2 data-i="s2"></h2>
    <div class="row" style="justify-content:space-between"><b id="who"></b><span><span class="score" id="score"></span> <span class="mut">/ <span id="max"></span></span></span></div>
    <img id="prev" class="prev hidden" alt="">
    <div id="pageNav" class="row hidden" style="margin:8px 0">
      <button id="previousPage" type="button">←</button><span id="pageCount" class="mut" aria-live="polite"></span><button id="nextPage" type="button">→</button>
      <a id="openPage" class="btn" target="_blank" rel="noopener" data-i="openPage"></a>
    </div>
    <pre id="transcript"></pre>
    <div id="descs"></div>
    <div id="errBox"></div>
    <label class="mut" data-i="hintLbl"></label>
    <textarea id="hint" rows="2"></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="approve" data-i="approve"></button><span class="mut" id="aiNote"></span></div>
  </section>

  <section class="card">
    <h2 data-i="s3"></h2>
    <div class="row"><button id="srcDemo" class="on" data-i="srcDemo"></button><button id="srcMine" data-i="srcMine"></button>
      <button id="csv" data-i="csv"></button></div>
    <div id="trustStats" class="trust-stats hidden" aria-live="polite">
      <div id="agreement"></div>
      <div><b id="savedTime"></b><small id="timeEstimate" data-i="timeEstimate"></small></div>
    </div>
    <p class="mut" id="mapInfo"></p>
    <div id="bars"></div>
    <h3 style="font-size:15px;margin:14px 0 0" data-i="next"></h3>
    <div id="tips"></div>
  </section>
  </div>
  <p class="mut" style="text-align:center" data-i="privacy"></p>
</main>
<div class="toast" id="toast"></div>

<script>
const T = {
  // Код вымышленного ученика одинаков в обоих языках.
  ru:{workPages:"Страницы работы",previousPage:"Предыдущая страница",nextPage:"Следующая страница",pageCount:(i,n)=>`Страница ${i} из ${n}`,openPage:"Открыть фото",batchReplace:"Заменить фото этой работы (1–4)",batchReplaceError:"Выберите от 1 до 4 фото для этой работы.",batchReplacement:(n)=>`Новые фото: ${n}. Нажмите «Продолжить», чтобы проверить.`,batchNew:"📚 Проверить пачку работ",backBatch:"← Отчёт пачки",batchHelp:"Загрузите фото класса с напечатанными условиями в порядке работ. По умолчанию 2 страницы на ученика: измените число страниц или номер ученика у каждого фото. Сначала проверьте распределение. Фото и очередь не сохраняются после перезагрузки — выгрузите отчёт в CSV.",batchRules:(limit)=>`До 30 работ за пачку, 1–4 страницы на работу. Отдельный лимит: ${limit} работ в час; каждая работа — распознавание задания и проверка ИИ.`,batchFiles:"Все фото класса (до 120)",batchPages:"Страниц на ученика по умолчанию:",batchPhoto:(n)=>`Фото ${n} → ученик №`,batchGroupSummary:(pages,works)=>`Фото: ${pages}. Работ: ${works}.`,batchGroupError:"Выберите 1–120 фото; номера учеников — от 1 до 30, на каждого должно приходиться 1–4 страницы.",batchStart:"Проверить пачку",batchContinue:"Продолжить проверку",batchRetry:"Повторить неудачные",batchStop:"Остановить после текущей работы",batchReset:"Новая пачка (очистить отчёт)",batchReport:"Отчёт по пачке",batchAiWarning:"Оценки предварительные. ИИ распознал условия и предложил эталон для каждой работы — проверьте его. Утверждает учитель.",batchProgress:(done,total,errors,approved)=>`Проверено: ${done}/${total}. Не проверено из-за ошибки: ${errors}. Утверждено: ${approved}.`,batchReview:"Проверить результат →",batchErrorStatus:"Ошибка проверки",batchReady:"Проверено ИИ",batchPending:"Ожидает проверки",batchChecking:"ИИ распознаёт задание и проверяет работу…",batchFailed:"Не удалось проверить работу. Проверьте фото и повторите.",batchNoKey:"Проверка пачки недоступна: нет ключа API. Демо А/Б/В остаётся доступным.",batchStopping:"Завершаем текущую работу, затем остановимся.",batchStopped:"Проверка остановлена. Готовые результаты сохранены здесь, оставшиеся можно проверить кнопкой «Продолжить».",batchDone:"Обработка пачки завершена. Проверьте результаты и выгрузите CSV.",batchKey:"Распознанное условие и эталон ИИ",batchScore:"Балл",batchErrors:"Замечания",batchHint:"Подсказка",batchApproved:"Утверждено учителем",batchStudent:"Ученик",batchStatus:"Статус",batchMax:"Максимум",batchPercent:"Процент",batchTask:"Задание",draftSources:"Подготовка по фото — необязательно",draftHelp:"Загрузите 1–4 фото листа заданий или введите условие ниже. Можно добавить критерии/ключ: до 4 фото и/или текст. ИИ заполнит поля, а вы проверите и исправите результат. Фото не сохраняются.",draftImages:"Фото листа заданий (1–4 стр.)",draftRubricImages:"Фото критериев/ключа (необязательно, до 4 стр.)",draftRubricText:"Текст критериев/ключа (необязательно)",prepareDraft:"✨ Подготовить с ИИ",draftWorking:"ИИ готовит задание…",draftProposal:"Предложено ИИ — проверьте перед использованием",draftNoKey:"Подготовка с ИИ недоступна: нет ключа API. Заполните задание вручную.",draftInput:"Добавьте 1–4 фото задания или условие ниже. Критерии — до 4 фото.",draftFailed:"Не удалось подготовить задание. Проверьте фото или заполните поля вручную.",customNew:"Любой СОР/БЖБ",customHelp:"Введите своё задание и эталон. Каждый дескриптор — отдельная строка и 1 балл (до 30). Затем загрузите фото работ. Задание хранится только в этом браузере; для проверки нужен API-ключ.",customTitle:"Название задания",customPrompt:"Условие задания",customAnswer:"Эталон ответа и ход решения",customDescriptors:"Дескрипторы (по одному на строку)",saveCustom:"Сохранить задание и перейти к фото",customInvalid:"Заполните все поля: название до 120 знаков, условие и эталон до 10 000, от 1 до 30 дескрипторов по 500 знаков.",resultLocalOnly:"Результат сохранён только до перезагрузки: хранилище браузера недоступно.",customLocalOnly:"Хранилище браузера недоступно: задание сохранено только до перезагрузки.",criterionError:(text)=>`Не выполнено: ${text}`,criterionTip:"Повторите этот шаг на похожем задании.",desk:"Рабочий стол учителя",scheduleTitle:"Расписание · 7«А» · Алгебра",backSchedule:"← Расписание",goal:"Цель урока",slides:"Презентация",assessment:"Задание",startAssessment:"Проверить БЖБ/СОР",days:{mon:"Понедельник",tue:"Вторник",wed:"Среда",thu:"Четверг",fri:"Пятница"},agreement:(x,n,m)=>`Согласие учителя с ИИ: ${x}% (${n} из ${m} работ утверждены без правок)`,savedTime:(k)=>`Сэкономлено ≈ ${k} мин`,timeEstimate:"оценка: 5 мин вручную против 1 мин с Тексером",sub:"проверка БЖБ/ТЖБ по дескрипторам",s1:"1. Работа ученика",s2:"2. Проверка ИИ → решение учителя",s3:"3. Карта ошибок класса",

    hintLbl:"Подсказка ученику (по первой ошибке, без ответа) — можно править:",approve:"✓ Утвердить",firstErr:"Первая ошибка",noErr:"Ошибок нет",

    mapDemo:(n)=>`Вымышленный класс, ${n} учеников. Доля учеников с ошибкой:`,mapMine:(n)=>`Утверждено работ: ${n}. Доля работ с ошибкой:`,
    empty:"Пока нет утверждённых работ.",live:(m)=>`ИИ: ${m}`,demoOnly:"Демо-режим",noKey:"Загрузка своих фото выключена (нет ключа API).",

function customTaskFrom(value){
  const text=(v,max)=>typeof v==="string"&&v.trim().length>0&&v.length<=max;
  if(!value||typeof value.id!=="string"||!/^custom-[a-zA-Z0-9-]{1,80}$/.test(value.id)||!text(value.title,120)||!text(value.prompt,10000)||!text(value.answer,10000)||!Array.isArray(value.descriptors)||!value.descriptors.length||value.descriptors.length>30||!value.descriptors.every(d=>text(d,500)))return null;
  const definition={id:value.id,title:value.title.trim(),prompt:value.prompt.trim(),answer:value.answer.trim(),descriptors:value.descriptors.map(d=>d.trim())};
  return {id:definition.id,custom:true,definition,title:{ru:definition.title,kk:definition.title},parts:[{id:"1",text:definition.prompt,answer:definition.answer}],descriptors:definition.descriptors.map((text,i)=>({id:`D${i+1}`,part:"1",text,kk:text})),errorTags:definition.descriptors.map((text,i)=>({id:`D${i+1}`,ru:T.ru.criterionError(text),kk:T.kk.criterionError(text),tip:{ru:T.ru.criterionTip,kk:T.kk.criterionTip}}))};
}

function showScreen(next){
  screen=next;
  $("batchScreen").classList.toggle("hidden",screen!=="batch");
  $("backBatch").classList.toggle("hidden",screen!=="assessment"||cur?.batchId!==batch.id);
  $("scheduleScreen").classList.toggle("hidden",screen!=="schedule");
  $("lessonScreen").classList.toggle("hidden",screen!=="lesson");
  $("assessmentScreen").classList.toggle("hidden",screen!=="assessment");
  $("backSchedule").classList.toggle("hidden",screen==="schedule");
  window.scrollTo(0,0);
}
function renderSchedule(){
  const formatDate=(value)=>new Intl.DateTimeFormat(lang==="kk"?"kk-KZ":"ru-RU",{day:"numeric",month:"long"}).format(new Date(value+"T12:00:00"));
  $("weekGrid").replaceChildren(...schedule.map((item,index)=>{
    const button=document.createElement("button");
    button.className="lesson-button";button.dataset.lesson=index;
    const day=document.createElement("b");day.textContent=t("days")[item.day];
    const date=document.createElement("time");date.dateTime=item.date;date.textContent=formatDate(item.date);
    const topic=document.createElement("span");topic.textContent=item.topic[lang];
    button.append(day,date,topic);
    button.onclick=()=>{lesson=item;renderSchedule();showScreen("lesson")};
    return button;
  }));
  if(!lesson)return;
  $("lessonDate").textContent=t("days")[lesson.day]+" · "+formatDate(lesson.date);
  $("lessonTopic").textContent=lesson.topic[lang];
  $("lessonGoal").textContent=lesson.goal[lang];
  const slides=(lesson.slides||"").trim();
  $("lessonSlides").hidden=!slides||slides==="#";
  if(slides&&slides!=="#")$("lessonSlides").href=slides;
  else $("lessonSlides").removeAttribute("href");
  const assessment=tasks.find(item=>item.id===lesson.assessment);
  $("lessonAssessment").classList.toggle("hidden",!assessment);
  $("lessonTask").textContent=assessment?assessment.title[lang]:"";
}
$("backSchedule").onclick=()=>showScreen("schedule");
$("startAssessment").onclick=()=>{
  if(!lesson?.assessment)return;
  $("taskSel").value=lesson.assessment;
  $("taskSel").dispatchEvent(new Event("change"));
  showScreen("assessment");
};

}

$("approve").onclick=()=>{
  const r=cur.res, hintEdited=$("hint").value!==cur.aiHint;r.hint=$("hint").value.trim();cur.approved=true;
  if(task().custom)r.error_tags=r.descriptors.filter(d=>!d.met).map(d=>d.id);
  const list=store.get().filter(x=>!(x.student===cur.student&&(x.taskId||tasks[0].id)===task().id));
  list.push({taskId:task().id,variant:r.variant||"",student:cur.student,score:scoreOf(r),aiScore:cur.aiScore,edited:r.descriptors.some(d=>d.met!==cur.aiDescriptors.find(x=>x.id===d.id)?.met)||hintEdited,tags:r.error_tags,hint:r.hint,ts:Date.now()});
  const persisted=store.set(list);renderCheck();src="mine";renderStatic();toast(t(persisted?"sent":"resultLocalOnly"));
};

function renderMap(){

  $("trustStats").classList.toggle("hidden",total===0);
  $("agreement").textContent=total?t("agreement",Math.round(100*unchanged/total),unchanged,total):"";
  $("savedTime").textContent=total?t("savedTime",total*4):"";

  else{const l=mine();n=l.length;l.forEach(x=>x.tags.forEach(g=>counts[g]=(counts[g]||0)+1));$("mapInfo").textContent=n?t("mapMine",n):t("empty")}
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

  $("tips").innerHTML=rows.slice(0,2).map(([g])=>{const e=task().errorTags.find(x=>x.id===g);return e?`<div class="tip"><b>${escapeHTML(tagName(g))}</b><br>${escapeHTML(e.tip[lang])}</div>`:""}).join("");
}
function selectTask(id){releaseCurPreviews();tid=id;cur=null;$("checkCard").classList.add("hidden");src=task().variants||task().custom?"mine":"demo";renderStatic()}
$("taskSel").onchange=(e)=>selectTask(e.target.value);
$("srcDemo").onclick=()=>{src="demo";renderStatic()};$("srcMine").onclick=()=>{src="mine";renderStatic()};
$("csv").onclick=()=>{
  const l=mine(), ds=task().descriptors.length;
  const rows=[["Ученик","Вариант","Балл","Макс","Балл ИИ","Исправлено учителем","Ошибки"],...l.map(x=>[x.student,x.variant||"",x.score,ds,x.aiScore,x.edited?"да":"нет",x.tags.map(tagName).join("; ")])];
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");

document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on",x===b));renderStatic()});

function shrink(file){return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);try{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85))}catch(err){no(err)}};img.onerror=()=>{URL.revokeObjectURL(url);no(new Error(t("photoError")))};img.src=url})}
function renderUploadState(){
  const busy=checking||drafting||batchBusy;
  document.querySelectorAll("#customForm input,#customForm textarea,#customForm button").forEach(el=>el.disabled=busy);
  $("prepareDraft").textContent=t(drafting?"draftWorking":"prepareDraft");
  $("draftSources").setAttribute("aria-busy",String(drafting));
  if(drafting)$("draftStatus").textContent=t("draftWorking");
  $("samplePhoto").disabled=busy||!status.live;
  $("file").disabled=busy||tid===NEW_CUSTOM;
  $("upLabel").setAttribute("aria-busy",String(checking));
  $("samplePhoto").setAttribute("aria-busy",String(checking));
  [$("taskSel"),$("backSchedule"),$("startAssessment"),$("newCustom"),$("newBatch"),$("backBatch"),...document.querySelectorAll("[data-w]")].forEach(el=>el.disabled=busy);
}
$("prepareDraft").onclick=async()=>{
  if(drafting||checking||batchBusy)return;
  if(!status.live){$("draftStatus").textContent=t("draftNoKey");return}
  const photos=[...$("draftImages").files],rubricPhotos=[...$("draftRubricImages").files];
  const text=$("customPrompt").value,rubricText=$("draftRubricText").value,requestLang=lang;
  if(photos.length>4||rubricPhotos.length>4||(!photos.length&&!text.trim())){$("draftStatus").textContent=t("draftInput");return}
  drafting=true;renderUploadState();
  try{
    const [images,rubricImages]=await Promise.all([Promise.all(photos.map(shrink)),Promise.all(rubricPhotos.map(shrink))]);
    const r=await fetch("/api/task-draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,rubricImages,rubricText,text,lang:requestLang})});
    const draft=await r.json();if(!r.ok)throw new Error(draft.error||t("draftFailed"));
    const proposed=customTaskFrom({...draft,id:"custom-draft"});
    if(!proposed||draft.descriptors.some(d=>/[\r\n]/.test(d)))throw new Error(t("draftFailed"));
    $("customTitle").value=draft.title;$("customPrompt").value=draft.prompt;
    $("customAnswer").value=draft.answer;$("customDescriptors").value=draft.descriptors.join("\n");
    $("draftProposal").hidden=false;$("draftStatus").textContent="";
    $("draftProposal").scrollIntoView({behavior:"smooth",block:"center"});
  }catch(err){$("draftStatus").textContent=err.message||t("draftFailed")}
  finally{drafting=false;renderUploadState()}
};
async function checkPhotos(loadFiles,student){
  if(checking||drafting||batchBusy||tid===NEW_CUSTOM)return;
  if(!status.live){toast(t("noKey"));return}
  const taskId=task().id,requestLang=lang,customTask=task().definition;
  checking=true;renderUploadState();releaseCurPreviews();
  cur={student,image:null,res:{readable:true,transcript:"",descriptors:[],first_error:null,hint:"",error_tags:[]},aiScore:0,approved:true,pending:true};
  renderCheck();$("checkCard").scrollIntoView({behavior:"smooth"});
  try{
    const files=await loadFiles(),images=await Promise.all(files.map(shrink));
    cur.ownedPreviews=files.map(file=>URL.createObjectURL(file));cur.images=cur.ownedPreviews;cur.pageIndex=0;cur.image=cur.images[0];renderCheck();
    const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({taskId,images,lang:requestLang,student,...(customTask?{customTask}:{})})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||t("photoError"));
    cur.res=d;cur.transcript=d.transcript;cur.aiScore=scoreOf(d);cur.aiHint=d.hint;cur.aiDescriptors=structuredClone(d.descriptors);cur.approved=false;cur.pending=false;renderCheck();
  }catch(err){cur.transcript=err.message||t("photoError");cur.pending=false;cur.failed=true;renderCheck()}
  finally{checking=false;renderUploadState()}
}
$("file").onchange=(e)=>{
  const files=[...e.target.files].slice(0,4);e.target.value="";if(!files.length)return;
  const n=mine().length+(task().variants||task().custom?1:demo.works.length+1);
  return checkPhotos(()=>files,"У-"+String(n).padStart(2,"0"));
};
$("samplePhoto").onclick=()=>checkPhotos(()=>Promise.all([1,2].map(async(page)=>{
  const r=await fetch(`/samples/variant25-page${page}.jpg`);
  if(!r.ok)throw new Error(t("photoError"));
  return r.blob();
})),t("sampleStudent"));


function batchGroups(){
  const groups=new Map();
  if(!batch.photos.length||batch.photos.length>120)return null;
  for(let i=0;i<batch.photos.length;i++){
    const photo=batch.photos[i],id=photo.group;
    if(!Number.isInteger(id)||id<1||id>30||(photo.file.type&&!photo.file.type.startsWith("image/")))return null;
    if(!groups.has(id))groups.set(id,[]);
    groups.get(id).push(i);if(groups.get(id).length>4)return null;
  }
  return [...groups].sort((a,b)=>a[0]-b[0]);
}
const batchFilesFor=row=>row.replacement?.files||row.indices.map(i=>batch.photos[i].file);
const batchURLsFor=row=>row.replacement?.urls||row.indices.map(i=>batch.photos[i].url);
function batchApproval(row){return store.get().find(x=>x.taskId===row.id&&x.student===row.student)}
function batchDetails(row){
  const approved=batchApproval(row),result=row.result;
  if(!result)return {approved:null,score:null,max:null,error:row.error||"",hint:""};
  const tags=approved?.tags||result.error_tags;
  const error=approved?tags.map(id=>row.task.descriptors[Number(id.slice(1))-1]||id).join("; "):(result.first_error?.text||"");
  return {approved,score:approved?approved.score:scoreOf(result),max:row.task.descriptors.length,error:error||t("noErr"),hint:approved?approved.hint:result.hint};
}
function renderBatch(){
  const groups=batchGroups(),eligible=batch.rows.filter(r=>r.state!=="ready");
  $("batchRules").textContent=t("batchRules",status.batchLimitPerHour||30);
  $("batchConfig").disabled=batch.started||batchBusy;
  $("batchGrouping").innerHTML=batch.photos.map((photo,i)=>`<div class="batch-photo"><img src="${escapeHTML(photo.url)}" alt="" loading="lazy"><label>${escapeHTML(t("batchPhoto",i+1))}<input data-page="${i}" type="number" min="1" max="30" value="${Number.isInteger(photo.group)?photo.group:""}" ${batch.started?"disabled":""}><br><small>${escapeHTML(photo.file.name)}</small></label></div>`).join("");
  document.querySelectorAll("#batchGrouping [data-page]").forEach(input=>input.onchange=()=>{
    batch.photos[Number(input.dataset.page)].group=Number(input.value);renderBatch();
  });
  $("batchSummary").textContent=groups?t("batchGroupSummary",batch.photos.length,groups.length):(batch.photos.length?t("batchGroupError"):"");
  $("batchNotice").textContent=batchBusy?(batch.stop?t("batchStopping"):t("batchChecking")):(!status.live?t("batchNoKey"):batch.message);
  $("batchStart").disabled=batchBusy||checking||drafting||!groups;
  $("batchStart").hidden=batch.started&&!eligible.length;
  $("batchStart").textContent=t(!batch.started?"batchStart":batch.rows.some(r=>r.state==="pending")?"batchContinue":"batchRetry");
  $("batchStop").disabled=!batchBusy||batch.stop;
  $("batchReset").disabled=batchBusy;
  $("batchReport").classList.toggle("hidden",!batch.rows.length);
  const done=batch.rows.filter(r=>r.state==="ready"),errors=batch.rows.filter(r=>r.state==="error");
  const approved=done.map(batchApproval).filter(Boolean),unchanged=approved.filter(a=>a.edited===false).length;
  $("batchProgress").textContent=t("batchProgress",done.length,batch.rows.length,errors.length,approved.length);
  $("batchAgreement").classList.toggle("hidden",!approved.length);
  $("batchAgreement").textContent=approved.length?t("agreement",Math.round(100*unchanged/approved.length),unchanged,approved.length):"";
  $("batchCSV").disabled=batchBusy||!batch.rows.length;
  $("batchRows").innerHTML=batch.rows.map((row,index)=>{
    const d=batchDetails(row),ready=row.state==="ready";
    const state=t(d.approved?"batchApproved":ready?"batchReady":row.state==="checking"?"batchChecking":row.state==="error"?"batchErrorStatus":"batchPending");
    return `<article class="batch-row"><div class="row"><h3>${escapeHTML(row.student)}</h3><span class="badge">${escapeHTML(state)}</span></div>${ready?`<p><b>${escapeHTML(t("batchScore"))}: ${d.score} / ${d.max} · ${Math.round(100*d.score/d.max)}%</b></p><p>${escapeHTML(t("batchErrors"))}: ${escapeHTML(d.error)}</p><p>${escapeHTML(t("batchHint"))}: ${escapeHTML(d.hint)}</p><details><summary>${escapeHTML(t("batchKey"))}</summary><p>${escapeHTML(row.task.title)}</p><pre>${escapeHTML(row.task.prompt)}</pre><pre>${escapeHTML(row.task.answer)}</pre><ol>${row.task.descriptors.map(d=>`<li>${escapeHTML(d)}</li>`).join("")}</ol></details><button data-review="${index}" ${batchBusy?"disabled":""}>${escapeHTML(t("batchReview"))}</button>`:row.error?`<p class="err">${escapeHTML(row.error)}</p>`:""}${!ready?`<p><label class="btn">${escapeHTML(t("batchReplace"))}<input data-replace="${index}" type="file" accept="image/*" multiple hidden ${batchBusy?"disabled":""}></label></p>${row.replacement?`<p class="mut">${escapeHTML(t("batchReplacement",row.replacement.files.length))}</p><div class="row">${row.replacement.urls.map(url=>`<img src="${escapeHTML(url)}" alt="" style="width:52px;height:68px;object-fit:contain">`).join("")}</div>`:""}`:""}</article>`;
  }).join("");
  document.querySelectorAll("#batchRows [data-replace]").forEach(input=>input.onchange=()=>{
    if(batchBusy)return;
    const row=batch.rows[Number(input.dataset.replace)],files=[...input.files];if(!files.length)return;
    if(files.length>4||files.some(f=>f.type&&!f.type.startsWith("image/"))){row.error=t("batchReplaceError");renderBatch();return}
    row.replacement?.urls.forEach(url=>URL.revokeObjectURL(url));
    row.replacement={files,urls:files.map(file=>URL.createObjectURL(file))};row.state="pending";row.error="";renderBatch();
  });
  document.querySelectorAll("#batchRows [data-review]").forEach(button=>button.onclick=()=>reviewBatchRow(Number(button.dataset.review)));
}
$("newBatch").onclick=()=>{renderBatch();showScreen("batch")};
$("backBatch").onclick=()=>{renderBatch();showScreen("batch")};
$("batchReset").onclick=()=>{
  if(batchBusy)return;
  if(cur?.batchId===batch.id){cur=null;$("prev").removeAttribute("src");$("checkCard").classList.add("hidden");$("backBatch").classList.add("hidden")}
  batch.photos.forEach(p=>URL.revokeObjectURL(p.url));
  batch.rows.forEach(row=>row.replacement?.urls.forEach(url=>URL.revokeObjectURL(url)));
  batch={id:crypto.randomUUID(),photos:[],rows:[],started:false,stop:false,message:""};
  $("batchFiles").value="";$("batchPages").value="2";$("batchRubricText").value="";renderBatch();
};
$("batchFiles").onchange=e=>{
  if(batch.started||batchBusy)return;
  batch.photos.forEach(p=>URL.revokeObjectURL(p.url));
  const pages=Number($("batchPages").value),files=[...e.target.files];
  if(files.length>120){batch.photos=[];batch.message=t("batchGroupError");$("batchFiles").value="";renderBatch();return}
  batch.photos=files.map((file,i)=>({file,url:URL.createObjectURL(file),group:Math.floor(i/pages)+1}));renderBatch();
};
$("batchPages").onchange=()=>{
  if(batch.started||batchBusy)return;
  const pages=Number($("batchPages").value);
  batch.photos.forEach((photo,i)=>photo.group=Math.floor(i/pages)+1);renderBatch();
};
$("batchStop").onclick=()=>{batch.stop=true;renderBatch()};
$("batchStart").onclick=async()=>{
  if(batchBusy||checking||drafting)return;
  if(!status.live){batch.message=t("batchNoKey");renderBatch();return}
  const groups=batchGroups();if(!groups){batch.message=t("batchGroupError");renderBatch();return}
  if(!batch.started){
    batch.rows=groups.map(([group,indices])=>({id:`custom-${batch.id}-${group}`,student:"У-"+String(group).padStart(2,"0"),indices,state:"pending",error:"",task:null,result:null}));
    batch.started=true;
  }
  const queue=batch.rows.filter(row=>row.state!=="ready"),requestLang=lang,rubricText=$("batchRubricText").value;
  batchBusy=true;batch.stop=false;batch.message="";renderUploadState();renderBatch();
  try{
    for(const row of queue){
      if(batch.stop)break;
      row.state="checking";row.error="";renderBatch();
      try{
        const images=[];for(const file of batchFilesFor(row))images.push(await shrink(file));
        const r=await fetch("/api/batch-check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,rubricText,lang:requestLang})});
        const data=await r.json().catch(()=>null);
        if(!r.ok)throw Object.assign(new Error(),{status:r.status,userMessage:typeof data?.error==="string"?data.error:t("batchFailed")});
        const definition=customTaskFrom({...data?.task,id:row.id}),result=data?.result;
        if(!definition||!result||result.readable!==true||typeof result.hint!=="string"||typeof result.transcript!=="string"||!Array.isArray(result.descriptors)||result.descriptors.length!==definition.descriptors.length||definition.descriptors.some(d=>result.descriptors.filter(x=>x?.id===d.id&&typeof x.met==="boolean").length!==1))throw new Error();
        result.error_tags=result.descriptors.filter(d=>!d.met).map(d=>d.id);
        row.task=definition.definition;row.result=result;row.state="ready";
      }catch(err){
        row.state="error";row.error=err.userMessage||t("batchFailed");
        if(err.status===429||err.status===503){batch.stop=true;batch.message=row.error}
      }
      renderBatch();
    }
  }finally{
    batchBusy=false;if(!batch.message)batch.message=t(batch.stop?"batchStopped":"batchDone");renderUploadState();renderBatch();
  }
};
function reviewBatchRow(index){
  if(batchBusy)return;
  const row=batch.rows[index];if(row?.state!=="ready")return;
  const definition=customTaskFrom({...row.task,id:row.id});
  if(!tasks.some(t=>t.id===row.id)){
    tasks.push(definition);
    try{localStorage.setItem("tekser.customTasks",JSON.stringify(tasks.filter(t=>t.custom).map(t=>t.definition)))}catch{toast(t("customLocalOnly"))}
  }
  selectTask(row.id);
  const result=structuredClone(row.result),approved=batchApproval(row);
  const aiDescriptors=structuredClone(result.descriptors),aiHint=result.hint,aiScore=scoreOf(result);
  if(approved){result.descriptors.forEach(d=>d.met=!approved.tags.includes(d.id));result.hint=approved.hint;result.error_tags=[...approved.tags]}
  cur={student:row.student,images:batchURLsFor(row),pageIndex:0,image:batchURLsFor(row)[0]||null,res:result,transcript:result.transcript,approved:false,aiDescriptors,aiHint,aiScore,batchId:batch.id};
  renderStatic();showScreen("assessment");
}
$("batchCSV").onclick=()=>{
  const rows=[[t("batchStudent"),t("batchStatus"),t("batchTask"),t("batchScore"),t("batchMax"),t("batchPercent"),t("batchErrors"),t("batchHint")],...batch.rows.map(row=>{
    const d=batchDetails(row),ready=row.state==="ready";
    return [row.student,ready?t(d.approved?"batchApproved":"batchReady"):(row.error||t("batchPending")),row.task?.title||"",ready?d.score:"",ready?d.max:"",ready?Math.round(100*d.score/d.max):"",d.error,d.hint];
  })];
  const cell=value=>{let s=String(value??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const url=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(row=>row.map(cell).join(";")).join("\n")],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="tekser-class-report.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

Promise.all([fetch("/api/tasks").then(r=>r.json()),fetch("/api/demo").then(r=>r.json()),fetch("/api/status").then(r=>r.json()),fetch("/api/schedule").then(r=>r.json())])
  .then(([a,b,c,d])=>{tasks=a;demo=b;status=c;schedule=d;
    try{const saved=JSON.parse(localStorage.getItem("tekser.customTasks")||"[]");if(Array.isArray(saved)){for(const value of saved){const item=customTaskFrom(value);if(item&&!tasks.some(x=>x.id===item.id))tasks.push(item)}}}catch{}
    renderStatic();showScreen("schedule")});
</script>
