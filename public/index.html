<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Тексер — проверка БЖБ/ТЖБ по дескрипторам</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e4e7ec;--acc:#2f5bd3;--ok:#1f8a4c;--bad:#c4372f;--soft:#eef2fd}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}h1 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
h2{font-size:17px;margin:0 0 10px}main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,label.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary,label.primary{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mut{color:var(--mut);font-size:14px}.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--acc)}
.parts{margin:8px 0 0;padding-left:20px}.parts li{margin:2px 0}
pre{white-space:pre-wrap;background:#fafafa;border:1px dashed var(--line);border-radius:8px;padding:10px;font:15px/1.5 "Comic Sans MS","Segoe Print",cursive;margin:8px 0}
.desc{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.desc input{width:20px;height:20px;margin-top:2px}
.desc span{min-width:0;overflow-wrap:anywhere}.desc .c{color:var(--mut);font-size:14px}.score{font-size:22px;font-weight:700}
.err{background:#fff5f4;border-left:4px solid var(--bad);padding:8px 10px;border-radius:6px;margin:10px 0}
.okbox{background:#f1fbf5;border-left:4px solid var(--ok);padding:8px 10px;border-radius:6px;margin:10px 0}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.bar{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:6px 0}.bar .t{font-size:14px}
.bar .track{grid-column:1/-1;height:10px;background:#eef0f3;border-radius:6px;overflow:hidden}.bar .fill{height:100%;background:var(--bad)}
.tip{background:var(--soft);border-radius:8px;padding:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%}
img.prev{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
.trust-stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0;padding:10px;background:var(--soft);border-radius:8px;font-size:14px}.trust-stats>div{flex:1 1 240px}.trust-stats small{display:block;color:var(--mut);font-size:12px}
.screen{display:grid;gap:14px;min-width:0}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.lesson-button{display:flex;flex-direction:column;gap:8px;text-align:left;height:100%;overflow-wrap:anywhere}.lesson-button:hover{border-color:var(--acc);background:var(--soft)}.lesson-button time{font-size:13px;color:var(--mut)}a.btn{display:inline-block;color:var(--acc);font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-decoration:none}.lesson-assessment{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:600px){.week{grid-template-columns:1fr}}
.hidden{display:none}
.brand{flex:1;min-width:0}.accuracy{font-size:12px;line-height:16px;color:var(--mut);margin:4px 0 0;text-wrap:pretty}
.quick-start{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.quick-start summary{cursor:pointer;font-weight:600}.quick-start p{margin:8px 0 0;overflow-wrap:anywhere}
.draft-sources{min-width:0;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.draft-sources input{display:block;max-width:100%;font:inherit}.draft-proposal{padding:10px;background:var(--soft);border-radius:8px}
.sample{margin-top:12px}.sample button{max-width:100%;text-align:left;white-space:normal}.sample small{display:block;margin-top:4px;font-size:12px;line-height:16px;color:var(--mut)}
[hidden]{display:none!important}
@media(max-width:600px){header{flex-wrap:wrap}.brand{flex-basis:100%}header>.row{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Тексер <small data-i="sub"></small></h1><p class="accuracy" data-i="accuracy"></p></div>
  <div class="row"><span id="status" class="badge"></span>
    <span class="lang row"><button data-l="ru" class="on">РУС</button><button data-l="kk">ҚАЗ</button></span></div>
</header>
<main>
  <div id="scheduleScreen" class="screen">
    <section class="card">
      <h2 data-i="desk"></h2>
      <p class="mut" data-i="scheduleTitle"></p>
      <details class="quick-start">
        <summary data-i="quickStart"></summary>
        <p class="mut" data-i="quickSteps"></p>
      </details>
      <p><button id="newCustom" data-i="customNew"></button></p>
      <div id="weekGrid" class="week"></div>
    </section>
  </div>
  <div><button id="backSchedule" class="hidden" data-i="backSchedule"></button></div>
  <section id="lessonScreen" class="card hidden">
    <p id="lessonDate" class="mut"></p>
    <h2 id="lessonTopic"></h2>
    <b data-i="goal"></b>
    <p id="lessonGoal"></p>
    <a id="lessonSlides" class="btn" href="#" data-i="slides"></a>
    <div id="lessonAssessment" class="lesson-assessment hidden">
      <b data-i="assessment"></b>
      <p id="lessonTask"></p>
      <button id="startAssessment" class="primary" data-i="startAssessment"></button>
    </div>
  </section>
  <div id="assessmentScreen" class="screen hidden">
  <section class="card">
    <h2 data-i="s1"></h2>
    <select id="taskSel" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);width:100%;margin-bottom:6px"></select>
    <form id="customForm" class="hidden">
      <h3 data-i="customNew"></h3>
      <p class="mut" data-i="customHelp"></p>
      <fieldset id="draftSources" class="draft-sources">
        <legend data-i="draftSources"></legend>
        <p class="mut" data-i="draftHelp"></p>
        <p><label for="draftImages" data-i="draftImages"></label><input id="draftImages" type="file" accept="image/*" multiple></p>
        <p><label for="draftRubricImages" data-i="draftRubricImages"></label><input id="draftRubricImages" type="file" accept="image/*" multiple></p>
        <p><label for="draftRubricText" data-i="draftRubricText"></label><textarea id="draftRubricText" rows="3" maxlength="10000"></textarea></p>
        <button id="prepareDraft" type="button" data-i="prepareDraft"></button>
        <p id="draftStatus" class="mut" role="status"></p>
      </fieldset>
      <p id="draftProposal" class="draft-proposal" data-i="draftProposal" hidden></p>
      <p><label for="customTitle" data-i="customTitle"></label><input id="customTitle" required maxlength="120" style="width:100%;font:inherit;padding:8px"></p>
      <p><label for="customPrompt" data-i="customPrompt"></label><textarea id="customPrompt" required maxlength="10000" rows="3"></textarea></p>
      <p><label for="customAnswer" data-i="customAnswer"></label><textarea id="customAnswer" required maxlength="10000" rows="3"></textarea></p>
      <p><label for="customDescriptors" data-i="customDescriptors"></label><textarea id="customDescriptors" required maxlength="15030" rows="4"></textarea></p>
      <button id="saveCustom" type="submit" class="primary" data-i="saveCustom"></button>
    </form>
    <div id="taskTitle" class="mut"></div>
    <ol id="parts" class="parts"></ol>
    <p class="mut" data-i="demoHelp" id="demoHelp"></p>
    <div class="row" id="demoBtns"></div>
    <div id="sampleBox" class="sample" hidden>
      <button id="samplePhoto" data-i="samplePhoto"></button>
      <small data-i="sampleNote"></small>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="btn primary" id="upLabel"><span data-i="upload"></span><input id="file" type="file" accept="image/*" multiple hidden></label>
      <span class="mut" id="upNote"></span>
    </div>
  </section>

  <section class="card hidden" id="checkCard">
    <h2 data-i="s2"></h2>
    <div class="row" style="justify-content:space-between"><b id="who"></b><span><span class="score" id="score"></span> <span class="mut">/ <span id="max"></span></span></span></div>
    <img id="prev" class="prev hidden" alt="">
    <pre id="transcript"></pre>
    <div id="descs"></div>
    <div id="errBox"></div>
    <label class="mut" data-i="hintLbl"></label>
    <textarea id="hint" rows="2"></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="approve" data-i="approve"></button><span class="mut" id="aiNote"></span></div>
  </section>

  <section class="card">
    <h2 data-i="s3"></h2>
    <div class="row"><button id="srcDemo" class="on" data-i="srcDemo"></button><button id="srcMine" data-i="srcMine"></button>
      <button id="csv" data-i="csv"></button></div>
    <div id="trustStats" class="trust-stats hidden" aria-live="polite">
      <div id="agreement"></div>
      <div><b id="savedTime"></b><small id="timeEstimate" data-i="timeEstimate"></small></div>
    </div>
    <p class="mut" id="mapInfo"></p>
    <div id="bars"></div>
    <h3 style="font-size:15px;margin:14px 0 0" data-i="next"></h3>
    <div id="tips"></div>
  </section>
  </div>
  <p class="mut" style="text-align:center" data-i="privacy"></p>
</main>
<div class="toast" id="toast"></div>

    mapDemo:(n)=>`Ойдан алынған сынып, ${n} оқушы. Қате жіберген оқушылар үлесі:`,mapMine:(n)=>`Бекітілген жұмыстар: ${n}. Қатесі бар жұмыстар үлесі:`,
    empty:"Әзірге бекітілген жұмыс жоқ.",live:(m)=>`ЖИ: ${m}`,demoOnly:"Демо-режим",noKey:"Өз фотоңызды жүктеу өшірулі (API кілті жоқ).",
    checking:"ЖИ фотоны тексеріп жатыр… (10–30 с)",sent:"Демо: оқушыға хабарлама дайын, ештеңе жіберілмеді.",aiScore:(s)=>`ЖИ ұпайы: ${s}`,
    unread:"Фото оқылмайды — жақсы жарықта қайта түсіріңіз.",privacy:"Фотолар серверде сақталмайды. Тек ойдан алынған немесе иесіз деректер; оқушылар — кодтар."}
};
let lang="ru", tasks=[], demo=null, status={}, cur=null, src="demo", tid=null, schedule=[], lesson=null, screen="schedule", checking=false, drafting=false;
const $=(id)=>document.getElementById(id), t=(k,...a)=>{const v=T[lang][k];return typeof v==="function"?v(...a):v};
const store={
  get(){if(memoryOnly)return mem;try{const value=JSON.parse(localStorage.getItem("tekser.approved")||"[]");return Array.isArray(value)?value:mem}catch{return mem}},
  set(v){mem=v;try{localStorage.setItem("tekser.approved",JSON.stringify(v));memoryOnly=false;return true}catch{memoryOnly=true;return false}}
};
let mem=[],memoryOnly=false;
const NEW_CUSTOM="new-custom";
const escapeHTML=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function customTaskFrom(value){
  const text=(v,max)=>typeof v==="string"&&v.trim().length>0&&v.length<=max;
  if(!value||typeof value.id!=="string"||!/^custom-[a-zA-Z0-9-]{1,80}$/.test(value.id)||!text(value.title,120)||!text(value.prompt,10000)||!text(value.answer,10000)||!Array.isArray(value.descriptors)||!value.descriptors.length||value.descriptors.length>30||!value.descriptors.every(d=>text(d,500)))return null;
  const definition={id:value.id,title:value.title.trim(),prompt:value.prompt.trim(),answer:value.answer.trim(),descriptors:value.descriptors.map(d=>d.trim())};
  return {id:definition.id,custom:true,definition,title:{ru:definition.title,kk:definition.title},parts:[{id:"1",text:definition.prompt,answer:definition.answer}],descriptors:definition.descriptors.map((text,i)=>({id:`D${i+1}`,part:"1",text,kk:text})),errorTags:definition.descriptors.map((text,i)=>({id:`D${i+1}`,ru:T.ru.criterionError(text),kk:T.kk.criterionError(text),tip:{ru:T.ru.criterionTip,kk:T.kk.criterionTip}}))};
}
const task=()=>tid===NEW_CUSTOM?{id:NEW_CUSTOM,custom:true,title:{ru:T.ru.customNew,kk:T.kk.customNew},parts:[],descriptors:[],errorTags:[]}:tasks.find(t=>t.id===tid)||tasks[0];
$("newCustom").onclick=()=>{selectTask(NEW_CUSTOM);showScreen("assessment")};
$("customForm").onsubmit=(e)=>{
  e.preventDefault();
  const value={id:"custom-"+crypto.randomUUID(),title:$("customTitle").value,prompt:$("customPrompt").value,answer:$("customAnswer").value,descriptors:$("customDescriptors").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)};
  const created=customTaskFrom(value);
  if(!created){toast(t("customInvalid"));return}
  tasks.push(created);
  try{localStorage.setItem("tekser.customTasks",JSON.stringify(tasks.filter(x=>x.custom).map(x=>x.definition)))}catch{toast(t("customLocalOnly"))}
  $("customForm").reset();$("draftProposal").hidden=true;$("draftStatus").textContent="";selectTask(created.id);
};
const mine=()=>store.get().filter(x=>(x.taskId||tasks[0].id)===task().id);
const tagName=(id)=>{const e=task().errorTags.find(x=>x.id===id);return e?(lang==="kk"?e.kk:e.ru):id};
function toast(m){const el=$("toast");el.textContent=m;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",3500)}

const quickStart=document.querySelector(".quick-start");
try{quickStart.open=localStorage.getItem("tekser.quickStart.open")==="true"}catch{}
quickStart.addEventListener("toggle",()=>{
  try{localStorage.setItem("tekser.quickStart.open",String(quickStart.open))}catch{}
});

function showScreen(next){
  screen=next;
  $("scheduleScreen").classList.toggle("hidden",screen!=="schedule");
  $("lessonScreen").classList.toggle("hidden",screen!=="lesson");
  $("assessmentScreen").classList.toggle("hidden",screen!=="assessment");
  $("backSchedule").classList.toggle("hidden",screen==="schedule");
  window.scrollTo(0,0);
}
function renderSchedule(){
  const formatDate=(value)=>new Intl.DateTimeFormat(lang==="kk"?"kk-KZ":"ru-RU",{day:"numeric",month:"long"}).format(new Date(value+"T12:00:00"));
  $("weekGrid").replaceChildren(...schedule.map((item,index)=>{
    const button=document.createElement("button");
    button.className="lesson-button";button.dataset.lesson=index;
    const day=document.createElement("b");day.textContent=t("days")[item.day];
    const date=document.createElement("time");date.dateTime=item.date;date.textContent=formatDate(item.date);
    const topic=document.createElement("span");topic.textContent=item.topic[lang];
    button.append(day,date,topic);
    button.onclick=()=>{lesson=item;renderSchedule();showScreen("lesson")};
    return button;
  }));
  if(!lesson)return;
  $("lessonDate").textContent=t("days")[lesson.day]+" · "+formatDate(lesson.date);
  $("lessonTopic").textContent=lesson.topic[lang];
  $("lessonGoal").textContent=lesson.goal[lang];
  const slides=(lesson.slides||"").trim();
  $("lessonSlides").hidden=!slides||slides==="#";
  if(slides&&slides!=="#")$("lessonSlides").href=slides;
  else $("lessonSlides").removeAttribute("href");
  const assessment=tasks.find(item=>item.id===lesson.assessment);
  $("lessonAssessment").classList.toggle("hidden",!assessment);
  $("lessonTask").textContent=assessment?assessment.title[lang]:"";
}
$("backSchedule").onclick=()=>showScreen("schedule");
$("startAssessment").onclick=()=>{
  if(!lesson?.assessment)return;
  $("taskSel").value=lesson.assessment;
  $("taskSel").dispatchEvent(new Event("change"));
  showScreen("assessment");
};

function renderStatic(){
  renderSchedule();
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.documentElement.lang=lang==="kk"?"kk":"ru";
  $("status").textContent=status.live?t("live",status.model):t("demoOnly");
  $("upNote").textContent=status.live?"":t("noKey");
  $("upLabel").style.opacity=status.live?1:.5;
  $("taskSel").innerHTML=tasks.map(item=>`<option value="${escapeHTML(item.id)}" ${item.id===task().id?"selected":""}>${escapeHTML(item.title[lang])}</option>`).join("")+`<option value="${NEW_CUSTOM}" ${tid===NEW_CUSTOM?"selected":""}>${t("customNew")}</option>`;
  $("customForm").classList.toggle("hidden",tid!==NEW_CUSTOM);
  $("srcDemo").hidden=Boolean(task().custom);
  const vs=task().variants;
  $("demoHelp").style.display=vs||task().custom?"none":"";
  $("taskTitle").textContent=vs?t("variants",Object.keys(vs).join(", ")):"";
  $("parts").innerHTML=(vs?Object.values(vs)[0]:task().parts).map(p=>`<li>${escapeHTML(p.text)}</li>`).join("");
  $("demoBtns").innerHTML=demo.works.filter(w=>w.taskId===task().id).map(w=>`<button data-w="${w.id}">${t("work")} ${({A:"А",B:"Б",C:"В"})[w.id]} · ${w.student}</button>`).join("");
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>openDemo(b.dataset.w));
  $("sampleBox").hidden=task().id!=="alg7-sa1-exponents";
  renderUploadState();
  $("srcDemo").classList.toggle("on",src==="demo");$("srcMine").classList.toggle("on",src==="mine");
  if(cur) renderCheck(); renderMap();
}

function openDemo(id){const w=demo.works.find(x=>x.id===id);tid=w.taskId;cur={student:w.student,image:null,res:structuredClone(w.result),transcript:w.transcript,approved:false};cur.aiScore=scoreOf(cur.res);cur.aiHint=cur.res.hint;cur.aiDescriptors=structuredClone(cur.res.descriptors);renderCheck();$("checkCard").scrollIntoView({behavior:"smooth"})}
const scoreOf=(r)=>r.descriptors.filter(d=>d.met).length;

function renderCheck(){
  $("checkCard").classList.remove("hidden");
  const r=cur.res, ds=task().descriptors;
  $("who").textContent=cur.student+(r.variant&&r.variant!==""?` · ${t("variant")} ${r.variant}`:"");$("max").textContent=ds.length;$("score").textContent=cur.pending||cur.failed?"…":scoreOf(r);
  $("prev").classList.toggle("hidden",!cur.image);if(cur.image)$("prev").src=cur.image;
  $("transcript").textContent=cur.pending?t("checking"):(r.readable===false?t("unread"):(cur.transcript||r.transcript||""));
  $("descs").innerHTML=ds.map(d=>{const x=r.descriptors.find(y=>y.id===d.id)||{met:false,comment:""};
    return `<label class="desc"><input type="checkbox" data-d="${escapeHTML(d.id)}" ${x.met?"checked":""} ${cur.approved?"disabled":""}><span><b>${escapeHTML(d.id)}</b> ${escapeHTML(lang==="kk"?d.kk:d.text)}<br><span class="c">${escapeHTML(x.comment||"")}</span></span></label>`}).join("");
  document.querySelectorAll("[data-d]").forEach(c=>c.onchange=()=>{r.descriptors.find(y=>y.id===c.dataset.d).met=c.checked;$("score").textContent=scoreOf(r)});
  $("errBox").hidden=Boolean(cur.pending||cur.failed);
  $("errBox").innerHTML=r.first_error?`<div class="err"><b>${t("firstErr")} (${escapeHTML(r.first_error.part)}):</b> ${escapeHTML(r.first_error.text)}${r.error_tags.length?`<br><span class="mut">${r.error_tags.map(tagName).map(escapeHTML).join(" · ")}</span>`:""}</div>`:`<div class="okbox">${t("noErr")}</div>`;
  $("hint").value=r.hint;$("hint").disabled=cur.approved;
  $("approve").disabled=cur.approved;$("aiNote").textContent=cur.pending||cur.failed?"":t("aiScore",cur.aiScore);
}

$("approve").onclick=()=>{
  const r=cur.res, hintEdited=$("hint").value!==cur.aiHint;r.hint=$("hint").value.trim();cur.approved=true;
  if(task().custom)r.error_tags=r.descriptors.filter(d=>!d.met).map(d=>d.id);
  const list=store.get().filter(x=>!(x.student===cur.student&&(x.taskId||tasks[0].id)===task().id));
  list.push({taskId:task().id,variant:r.variant||"",student:cur.student,score:scoreOf(r),aiScore:cur.aiScore,edited:r.descriptors.some(d=>d.met!==cur.aiDescriptors.find(x=>x.id===d.id)?.met)||hintEdited,tags:r.error_tags,hint:r.hint,ts:Date.now()});
  const persisted=store.set(list);renderCheck();src="mine";renderStatic();toast(t(persisted?"sent":"resultLocalOnly"));
};

function renderMap(){
  const approved=mine(), total=approved.length, unchanged=approved.filter(w=>w.edited===false).length;
  $("trustStats").classList.toggle("hidden",total===0);
  $("agreement").textContent=total?t("agreement",Math.round(100*unchanged/total),unchanged,total):"";
  $("savedTime").textContent=total?t("savedTime",total*4):"";
  let counts={},n=0;
  if(src==="demo"&&!task().custom){counts=demo.demoClass.tagCounts;n=demo.demoClass.students;$("mapInfo").textContent=t("mapDemo",n)}
  else{const l=mine();n=l.length;l.forEach(x=>x.tags.forEach(g=>counts[g]=(counts[g]||0)+1));$("mapInfo").textContent=n?t("mapMine",n):t("empty")}
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  $("bars").innerHTML=rows.map(([g,c])=>{const p=Math.round(100*c/n);return `<div class="bar"><span class="t">${escapeHTML(tagName(g))}</span><b>${c} · ${p}%</b><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`}).join("");
  $("tips").innerHTML=rows.slice(0,2).map(([g])=>{const e=task().errorTags.find(x=>x.id===g);return e?`<div class="tip"><b>${escapeHTML(tagName(g))}</b><br>${escapeHTML(e.tip[lang])}</div>`:""}).join("");
}
function selectTask(id){tid=id;cur=null;$("checkCard").classList.add("hidden");src=task().variants||task().custom?"mine":"demo";renderStatic()}
$("taskSel").onchange=(e)=>selectTask(e.target.value);
$("srcDemo").onclick=()=>{src="demo";renderStatic()};$("srcMine").onclick=()=>{src="mine";renderStatic()};
$("csv").onclick=()=>{
  const l=mine(), ds=task().descriptors.length;
  const rows=[["Ученик","Вариант","Балл","Макс","Балл ИИ","Исправлено учителем","Ошибки"],...l.map(x=>[x.student,x.variant||"",x.score,ds,x.aiScore,x.edited?"да":"нет",x.tags.map(tagName).join("; ")])];
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="tekser-bally.csv";a.click();
};
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on",x===b));renderStatic()});

function shrink(file){return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);try{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85))}catch(err){no(err)}};img.onerror=()=>{URL.revokeObjectURL(url);no(new Error(t("photoError")))};img.src=url})}
function renderUploadState(){
  const busy=checking||drafting;
  document.querySelectorAll("#customForm input,#customForm textarea,#customForm button").forEach(el=>el.disabled=busy);
  $("prepareDraft").textContent=t(drafting?"draftWorking":"prepareDraft");
  $("draftSources").setAttribute("aria-busy",String(drafting));
  if(drafting)$("draftStatus").textContent=t("draftWorking");
  $("samplePhoto").disabled=busy||!status.live;
  $("file").disabled=busy||tid===NEW_CUSTOM;
  $("upLabel").setAttribute("aria-busy",String(checking));
  $("samplePhoto").setAttribute("aria-busy",String(checking));
  [$("taskSel"),$("backSchedule"),$("startAssessment"),$("newCustom"),...document.querySelectorAll("[data-w]")].forEach(el=>el.disabled=busy);
}
$("prepareDraft").onclick=async()=>{
  if(drafting||checking)return;
  if(!status.live){$("draftStatus").textContent=t("draftNoKey");return}
  const photos=[...$("draftImages").files],rubricPhotos=[...$("draftRubricImages").files];
  const text=$("customPrompt").value,rubricText=$("draftRubricText").value,requestLang=lang;
  if(photos.length>4||rubricPhotos.length>4||(!photos.length&&!text.trim())){$("draftStatus").textContent=t("draftInput");return}
  drafting=true;renderUploadState();
  try{
    const [images,rubricImages]=await Promise.all([Promise.all(photos.map(shrink)),Promise.all(rubricPhotos.map(shrink))]);
    const r=await fetch("/api/task-draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,rubricImages,rubricText,text,lang:requestLang})});
    const draft=await r.json();if(!r.ok)throw new Error(draft.error||t("draftFailed"));
    const proposed=customTaskFrom({...draft,id:"custom-draft"});
    if(!proposed||draft.descriptors.some(d=>/[\r\n]/.test(d)))throw new Error(t("draftFailed"));
    $("customTitle").value=draft.title;$("customPrompt").value=draft.prompt;
    $("customAnswer").value=draft.answer;$("customDescriptors").value=draft.descriptors.join("\n");
    $("draftProposal").hidden=false;$("draftStatus").textContent="";
    $("draftProposal").scrollIntoView({behavior:"smooth",block:"center"});
  }catch(err){$("draftStatus").textContent=err.message||t("draftFailed")}
  finally{drafting=false;renderUploadState()}
};
async function checkPhotos(loadFiles,student){
  if(checking||drafting||tid===NEW_CUSTOM)return;
  if(!status.live){toast(t("noKey"));return}
  const taskId=task().id,requestLang=lang,customTask=task().definition;
  checking=true;renderUploadState();
  cur={student,image:null,res:{readable:true,transcript:"",descriptors:[],first_error:null,hint:"",error_tags:[]},aiScore:0,approved:true,pending:true};
  renderCheck();$("checkCard").scrollIntoView({behavior:"smooth"});
  try{
    const files=await loadFiles(),images=await Promise.all(files.map(shrink));
    cur.image=images[0];renderCheck();
    const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({taskId,images,lang:requestLang,student,...(customTask?{customTask}:{})})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||t("photoError"));
    cur.res=d;cur.transcript=d.transcript;cur.aiScore=scoreOf(d);cur.aiHint=d.hint;cur.aiDescriptors=structuredClone(d.descriptors);cur.approved=false;cur.pending=false;renderCheck();
  }catch(err){cur.transcript=err.message||t("photoError");cur.pending=false;cur.failed=true;renderCheck()}
  finally{checking=false;renderUploadState()}
}
$("file").onchange=(e)=>{
  const files=[...e.target.files].slice(0,4);e.target.value="";if(!files.length)return;
  const n=mine().length+(task().variants||task().custom?1:demo.works.length+1);
  return checkPhotos(()=>files,"У-"+String(n).padStart(2,"0"));
};
$("samplePhoto").onclick=()=>checkPhotos(()=>Promise.all([1,2].map(async(page)=>{
  const r=await fetch(`/samples/variant25-page${page}.jpg`);
  if(!r.ok)throw new Error(t("photoError"));
  return r.blob();
})),t("sampleStudent"));

Promise.all([fetch("/api/tasks").then(r=>r.json()),fetch("/api/demo").then(r=>r.json()),fetch("/api/status").then(r=>r.json()),fetch("/api/schedule").then(r=>r.json())])
  .then(([a,b,c,d])=>{tasks=a;demo=b;status=c;schedule=d;
    try{const saved=JSON.parse(localStorage.getItem("tekser.customTasks")||"[]");if(Array.isArray(saved)){for(const value of saved){const item=customTaskFrom(value);if(item&&!tasks.some(x=>x.id===item.id))tasks.push(item)}}}catch{}
    renderStatic();showScreen("schedule")});
</script>
